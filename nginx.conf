server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker: resuelve "cadena" en cada petición, así nginx arranca
    # aunque la cadena todavía no esté lista y la encuentra si se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Las peticiones JSON-RPC de la página van a la cadena por la red interna.
    location /rpc {
        set $cadena http://cadena:8545;
        rewrite ^/rpc/?(.*)$ /$1 break;
        proxy_pass $cadena;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
